name: Controlli di Qualità Flutter

on:
  pull_request:
    branches: [ main ]

jobs:
  verifica_codice:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del progetto
        uses: actions/checkout@v4

      - name: Installa Flutter nel server
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      - name: Scarica i pacchetti (pub get)
        run: flutter pub get

      - name: Controlla la qualità del codice (analyze)
        run: flutter analyze

      - name: Esegui i test unitari (test)
        run: flutter test